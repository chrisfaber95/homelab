# homelab: instellingen voor Ollama en de LLM-helper (F-017).
# Na een wijziging opnieuw installeren: sudo bash /home/claude/homelab/scripts/17-llm.sh

# Ollama, vastgepind. De hash staat bij het release-bestand ollama-linux-amd64.tar.zst op GitHub:
# gh api repos/ollama/ollama/releases/tags/v<versie> --jq '.assets[] | select(.name=="ollama-linux-amd64.tar.zst") | .digest'
OLLAMA_VERSION="0.40.11"
OLLAMA_SHA256="7bedab90dd122661be78798e9f0edf37fccf0cccf2699d2c58ea1a3afdc04b6d"

# Het model en zijn context.
# Laptop (GTX 1050, 2 GB): llama3.1:8b met 4096, bewust voor ~84% op de CPU: veel beter dan wat in 2 GB past,
# 10-40 s per job. Na de verhuizing (GTX 1080, 8 GB): LLM_NUM_CTX=8192, en dan hoort `ollama ps` 100% GPU te tonen.
LLM_MODEL="llama3.1:8b"
LLM_NUM_CTX=4096

# De helper: poort op het tailnet en de standaard-timeout per job in seconden.
LLM_PORT=8017
LLM_DEFAULT_TIMEOUT=60
