# homelab: instellingen voor homelab-deploy (F-018).
# Na een wijziging opnieuw installeren: sudo bash scripts/18-projects.sh

# Waar de repo-lijst vandaan komt: config/repos.conf in de deploy-clone van deze repo.
HOMELAB_REPO="chrisfaber95/homelab"
# Hoe vaak de box GitHub vraagt of main veranderd is (seconden).
POLL_SECONDS=20
# Deploy-clones, releases en status.
DEPLOY_ROOT="/srv/homelab"
# Het read-only GitHub-token van het account deploy.
TOKEN_FILE="/etc/homelab/github-deploy-token"
# Hoe lang een service na een herstart moet blijven draaien voordat de deploy als gelukt telt (seconden).
SERVICE_SETTLE_SECONDS=15
