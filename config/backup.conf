# homelab: backups en bewaking (F-020). Gelezen door homelab-backup, homelab-health en homelab-monitor.
# Na een wijziging opnieuw installeren: sudo bash /var/lib/homelab/repo/scripts/20-monitor.sh

# Waar de dagelijkse backup komt. Voorlopig de SSD zelf: dat beschermt tegen een vergissing of een kapotte
# installatie, niet tegen een kapotte SSD. Later de USB-HDD (bijvoorbeeld /mnt/backup/homelab).
BACKUP_DIR="/var/backups/homelab"
BACKUP_KEEP_DAYS=14
# De health check faalt als de laatste geslaagde backup ouder is dan dit, of als er minder vrij is dan dit.
BACKUP_MAX_AGE_HOURS=26
BACKUP_MIN_FREE_PCT=10
# Status van de laatste backup (leesbaar voor iedereen; zonder geheimen).
BACKUP_STATUS="/var/lib/homelab/monitor/backup.json"

# homelab-monitor: status van de checks en de overzichtspagina.
MONITOR_DIR="/var/lib/homelab/monitor"
OVERVIEW_DIR="/var/lib/homelab/overview"
OVERVIEW_PORT=8104
# Een check moet zo vaak achter elkaar falen voordat er een melding komt (de monitor draait elke 2 minuten).
FAIL_ROUNDS=2
# Offline-melding (later): een ping-URL van bijvoorbeeld healthchecks.io in dit bestand; leeg of weg = geen ping.
HEARTBEAT_URL_FILE="/etc/homelab/heartbeat-url"
