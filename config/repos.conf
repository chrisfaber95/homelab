# homelab: de repo's die de box bijhoudt (F-018). Elke push naar main staat binnen ~20 s op de box.
# Een regel per repo: <naam> <owner/repo> <soort>
#   sync     alleen een deploy-clone (bijvoorbeeld scripts)
#   compose  een compose-bestand in de root; draait in de rootless Docker van het account deploy.
#            Publiceer poorten als 8100-8199 (ufw: alleen via tailscale0), bij voorkeur "127.0.0.1:" of het Tailscale-adres.
#   service  een eigen systemd-unit deploy/<naam>.service in deze repo (installeren: scripts/18-projects.sh);
#            met een package.json eerst `npm ci` en `npm run build`.
# Uit de lijst halen: de dienst stopt en de deploy-clone wordt verwijderd (volumes van compose blijven).

homelab                chrisfaber95/homelab                          sync
claude-dashboard       chrisfaber95/claude-dashboard                 service
visualshopping-server  chrisfaber95/Visualshopping-Server-portfolio  compose
visualshopping-client  chrisfaber95/Client-portfolio                 compose
visualshopping-werk    chrisfaber95/Werknemers-portfolio             compose
f1-dashboard         chrisfaber95/f1-dashboard                     service
# sdlc-studio (H-013): unit deploy/sdlc-studio.service, on the tailnet via changes/0005-sdlc-studio-serve. Port 8111.
sdlc-studio            chrisfaber95/sdlc-studio                      service
# Home Assistant (H-008): the compose.yaml in the root of this repo, as its own project. Port 8110, Tailscale only.
homeassistant          chrisfaber95/homelab                          compose
# pixel-quest (H-014): docker-compose.yml in the repo root (app + Postgres). The app is published on
#   127.0.0.1:8114 (PORT/BIND_ADDR from /etc/homelab/pixel-quest.env); the tailnet entry is `tailscale serve`
#   on 8113, HTTP for now and HTTPS via changes/0007. Postgres has no published port.
pixel-quest            chrisfaber95/pixel-quest                      compose
# forge (H-015): unit deploy/forge.service, account and config by scripts/25-forge.sh. Port 8120 on the Tailscale address.
#   Forge's own project repos are never listed here; forge only ever writes to repos it created.
forge                  chrisfaber95/forge                            service
# discord bot (H-016): not a project. It lives in this repo (discord-bot/, systemd/homelab-discord-bot.service) and is installed
#   by scripts/26-discord-bot.sh, run by 21-inbox.sh. Own account, no port, token in /etc/homelab (docs/discord.md).
# kitt (H-018): the OpenJarvis web frontend recoloured to the dark and blue KITT style, a cockpit for the box with an
#   adapter server. Only a deploy-clone for now (`sync`); it becomes a `service` once it has a unit in deploy/.
kitt                   chrisfaber95/kitt                             sync
