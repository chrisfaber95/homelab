# Runs the repo's checks on every pull request (scripts/ci.sh).
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck jq
      - run: bash scripts/ci.sh
  frontend:
    # frontend/: lint, typecheck, tests, build, and the generated types must match backend/openapi.yaml.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/schema.d.ts
  backend:
    # backend/: Spring Boot skeleton (H-023), built and tested with the pinned Maven wrapper on JDK 21.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode verify
