  # ------------------------------------------------------------------------------------------------ chat door
  /api/chat/entries:
    x-code: ["/api/chat/entries"]
    get:
      tags: [chat door]
      summary: Read the conversation from a cursor
      x-access: chat door
      x-machine: true
      description: |
        Order of checks (shared by the three chat routes): peer is loopback, else 403 `loopback only`; bearer token
        names a client in `config/clients.json`, else 401; the client's switch is on (Discord: `discord` switch; kitt:
        `kitt` switch), else 403 with the switch state; then the permission `read`.
        `after` and `limit` default to 0 and 200 (empty values count as the default); the store clamps limit to
        1..1000. `next` is the id of the last entry returned, or `after` when there are none.
      security: [{chatBearer: []}]
      parameters:
        - {name: after, in: query, required: false, schema: {type: integer, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 200}}
      responses:
        "200":
          description: Entries with id > after, oldest first.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [entries, next]
                properties:
                  entries: {type: array, items: {$ref: "#/components/schemas/ConversationEntry"}}
                  next: {type: integer}
        "400": {$ref: "#/components/responses/ChatBadNumbers"}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403": {$ref: "#/components/responses/ChatForbidden"}
    post:
      tags: [chat door]
      summary: Append an entry as Chris
      x-access: chat door
      x-machine: true
      description: |
        JSON body (read up to 64 KiB; `Content-Length` is trusted): `kind` (default `message`; `message` needs
        permission `write`, `question` needs `ask`, `answer` needs `answer`), `text` (required), `ref` (optional,
        cut to 80 characters). The client always writes as author `chris`. The text is scrubbed of secrets and cut to
        20,000 characters; an empty text after trimming is a 400 `bad request: the text is empty`. Any other kind is a
        refusal (logged in `conversation_refusals` as `append:<kind>`).
      security: [{chatBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                kind: {type: string, enum: [message, question, answer], default: message}
                text: {type: string}
                ref: {type: string, nullable: true}
      responses:
        "200":
          description: The stored entry.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [entry]
                properties: {entry: {$ref: "#/components/schemas/ConversationEntry"}}
        "400":
          description: "Body is not JSON, `text` missing, text empty, or the body is not an object. Message is `bad request: <python exception text>`."
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                missing: {value: {error: "bad request: 'text'"}}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403":
          description: Not loopback, switched off, or no permission for this kind.
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                loopback: {value: {error: "loopback only"}}
                kind: {value: {error: "refused: discord may not write 'notification'"}}
  /api/chat/state:
    x-code: ["/api/chat/state"]
    get:
      tags: [chat door]
      summary: The switches clients may know
      x-access: chat door
      x-machine: true
      description: |
        Any authenticated client may ask (no permission needed, and it is answered even when the client's own switch is
        off: clients poll it to see the switches). Other methods that reach the door (POST) get 405 `GET only`.
      security: [{chatBearer: []}]
      responses:
        "200":
          description: Switch state.
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/ChatState"}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403": {description: "Not loopback", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "loopback only"}}}}
    post:
      tags: [chat door]
      summary: Not allowed (405)
      x-access: chat door
      x-machine: true
      security: [{chatBearer: []}]
      responses:
        "405": {description: Only GET, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "GET only"}}}}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403": {description: "Not loopback", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "loopback only"}}}}
  /api/chat/action:
    x-code: ["/api/chat/action"]
    post:
      tags: [chat door]
      summary: An explicit action of chat.py
      x-access: chat door
      x-machine: true
      description: |
        JSON body `{"action": <name>, ...}`. Free text never selects an action. Checks: loopback, token, the client's
        switch (403 with `refused: <why>` plus the state), then `FORBIDDEN` actions (`ssh_key`, `memory_edit`,
        `merge_homelab`: 403 `refused: <action> cannot be done from a chat client`, whatever the config says), then the
        action. Each action checks its own permission; a refusal is
        `403 {"error": "refused: <why>"}` where `<why>` is the switch reason (for example `Discord is switched off on
        the homelab page`, `approvals from Discord are off`) or `<client> may not <action with spaces>`.
        An unexpected exception is 500 `{"error": "the action failed; see the inbox journal"}`. A GET (or any method
        but POST) is 405 `POST only`.

        | action | permission | extra fields | 200 body |
        |---|---|---|---|
        | `task` | `start_task` | `repo` (repo list or `auto`), `text` | `{"task": id, "url"}` |
        | `answer` | `answer` | `task` (id), `text` | `{"task": id, "url"}` |
        | `state` | `read` | | `{"tasks": [{id, status, repo, what, source, url}]}` |
        | `jobs` | `read` | | `{"jobs": [{name, kind, when, paused, error}]}` |
        | `run_job` | `run_job` | `job` | `{"run": id, "job": name}` |
        | `research` | `research` | `question`, `mode` (default `quick`) | `{"run": id, "mode", "url"}` |
        | `drafts` | `read` | | `{"briefs": [{id, title}]}` |
        | `approve` | `approve` | `brief`, `mode` (`build` or `without-me`) | `{"confirm": token, "brief", "mode", "title", "expires_in"}` |
        | `confirm` | `approve` | `confirm` (token) | `{"task": id, "url", "brief", "mode"}` |

        Error bodies per action (status: message): `task` 400 `give a repo from the list (or 'auto') and a task text`,
        429 `daily limit reached: <n> task(s) per day may start from <Client>; nothing was started`;
        `answer` 404 `no such task`, 409 `task <id> is not waiting for an answer`;
        `run_job` 404 `no runnable job '<name>'`;
        `research` 400 `give a question and a mode: quick or deep`, 429 `daily limit reached: <n> Claude runs today;
        research and Claude jobs share it. Nothing was started; ask again tomorrow.`;
        `approve` 400 `give a brief id and a mode: build or without-me`, 409 `<id> is not a draft brief` or
        `<id> is already being built`, 429 (the task cap message);
        `confirm` 404 `unknown confirm token`, 410 `this confirmation is expired; nothing was approved` (or
        `already used` / `already failed`), 409 with the failure text (cap, no longer a draft, build refused).
        Unknown action: 400 `unknown action '<x>'`. Missing or invalid JSON: 400 `bad request: <python exception text>`.
        The confirm token is valid for `CONFIRM_TTL_SECONDS` (300) and for one use by the same client.
      security: [{chatBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [task, answer, state, jobs, run_job, research, drafts, approve, confirm, ssh_key, memory_edit, merge_homelab]}
                repo: {type: string}
                text: {type: string}
                task: {type: integer}
                job: {type: string}
                question: {type: string}
                mode: {type: string}
                brief: {type: string}
                confirm: {type: string}
              additionalProperties: true
      responses:
        "200":
          description: Body depends on the action (table above).
          content:
            application/json; charset=utf-8:
              schema: {type: object, additionalProperties: true}
        "400": {description: "bad request / unknown action / action specific validation", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403": {$ref: "#/components/responses/ChatForbidden"}
        "404": {description: "no such task / no runnable job / unknown confirm token", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: "task not waiting / brief not a draft / already building / approval failed", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "410": {description: "confirmation expired or already used", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: "daily limit", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "500": {description: "the action failed", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "the action failed; see the inbox journal"}}}}
    get:
      tags: [chat door]
      summary: Not allowed (405)
      x-access: chat door
      x-machine: true
      description: Past the token and switch checks any method other than POST is 405.
      security: [{chatBearer: []}]
      responses:
        "405": {description: POST only, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "POST only"}}}}
        "401": {$ref: "#/components/responses/ChatUnauthorized"}
        "403": {$ref: "#/components/responses/ChatForbidden"}
  # ------------------------------------------------------------------------------------------------ kitt door
  /api/clients/kitt:
    x-code: ["/api/clients/kitt"]
    get:
      tags: [kitt door]
      summary: kitt's switch and capabilities
      x-access: kitt door
      x-machine: true
      description: |
        Every kitt-door call: header `X-Homelab-Client` present (any value) enters the door. Then
        `kitt.identify` must return None: header equals `kitt` (else 403 `refused: not the kitt client`), the TCP peer
        is loopback and owned by kitt's service account `KITT_ACCOUNT` (default `homelab-app-kitt`, read from
        `/proc/net/tcp*`; else 403 `refused: not from kitt's service account`), and `Tailscale-User-Login` equals the
        tailnet owner (else 403 `refused: not Chris at the app`). A refusal is logged and answered
        `{"error": "refused: <why>"}`. A POST body is JSON, read up to 64 KiB, an empty body counts as `{}`; invalid JSON
        or a non-object is 400 `bad request: <python exception text>`. An unexpected exception is 500
        `{"error": "the action failed; see the inbox journal"}`. A call that is not one of the routes below is
        404 `{"error": "not a call kitt may make"}`. Handlers refuse with 403 `{"error": <why>}`, where `<why>` is
        `Kitt is switched off on the homelab page` or `kitt may not <permission with spaces>` (for approvals: `approvals
        from kitt are off`).
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      responses:
        "200":
          description: Capabilities; all false while the switch is off.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [enabled, permissions]
                properties:
                  enabled: {type: boolean}
                  permissions:
                    type: object
                    required: [chat, jobs, approvals, usage, logs]
                    properties:
                      chat: {type: boolean, description: "read, write, ask"}
                      jobs: {type: boolean, description: "read, run_job"}
                      approvals: {type: boolean, description: "approve"}
                      usage: {type: boolean, description: "read"}
                      logs: {type: boolean, description: "read"}
        "403": {$ref: "#/components/responses/KittRefused"}
        "404": {$ref: "#/components/responses/KittUnknown"}
  /api/conversation:
    x-code: ["/api/conversation"]
    get:
      tags: [kitt door]
      summary: Read the thread from a cursor (after)
      x-access: kitt door
      x-machine: true
      description: |
        Needs `read`. `after` is a number (a non-number counts as 0); at most 200 entries. Entries are mapped by
        `kitt.entry`: a `message` becomes `task` when its ref starts with `task:` or `job:`, else `question`; a kind
        outside `question, task, answer, notification, approval_request, approval` becomes `notification`; a client other
        than `discord`, `kitt`, `page` becomes `box`.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
        - {name: after, in: query, required: false, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Entries and the new cursor (`after` when empty).
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [entries, cursor]
                properties:
                  entries: {type: array, items: {$ref: "#/components/schemas/KittEntry"}}
                  cursor: {type: integer}
        "403": {$ref: "#/components/responses/KittRefused"}
    post:
      tags: [kitt door]
      summary: Send a question or a task typed in kitt
      x-access: kitt door
      x-machine: true
      description: |
        Body `{"kind": "question"|"task", "text": ...}`. A `task` is started like a Discord task
        (`chat.start_task("kitt", "auto", text)`, same cap, permission `start_task`; its errors pass through: 403
        `refused: ...`, 429 daily limit) and answered with its entry. A `question` needs `ask`, is stored, and answered
        later in the thread by the private search (background thread). 502 if a started task is not in the thread.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, text]
              properties:
                kind: {type: string, enum: [question, task]}
                text: {type: string}
      responses:
        "200":
          description: The new entry.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [entry]
                properties: {entry: {$ref: "#/components/schemas/KittEntry"}}
        "400": {description: "send a question or a task with a text (or bad request: ...)", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "send a question or a task with a text"}}}}
        "403": {$ref: "#/components/responses/KittRefused"}
        "429": {description: Daily task limit, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "502": {description: Task started but not in the thread, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "the task started but is not in the thread"}}}}
  /api/logs:
    x-code: ["/api/logs"]
    get:
      tags: [kitt door]
      summary: Recent logs (tasks and runs without a task)
      x-access: kitt door
      x-machine: true
      description: Needs `read`. The 30 newest tasks (not `queued`) and the 30 newest job runs without a task, sorted by `startedAt` descending, at most 40.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      responses:
        "200":
          description: Log list.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      required: [id, title, kind, state, startedAt]
                      properties:
                        id: {type: string, pattern: "^[tr][0-9]+$"}
                        title: {type: string, maxLength: 120}
                        kind: {type: string, enum: [task, job]}
                        state: {type: string, enum: [running, failed, finished]}
                        startedAt: {type: string}
        "403": {$ref: "#/components/responses/KittRefused"}
  /api/logs/{key}:
    x-code: ["/api/logs/([^/]+)"]
    get:
      tags: [kitt door]
      summary: A chunk of one log
      x-access: kitt door
      x-machine: true
      description: |
        Needs `read`. `key` must match `[tr]\d+`, and the task or run must exist, else 404 `no such log`. Lines are
        rendered as `HH:MM:SS [kind] text` (strings, unlike `/api/log/<key>` which returns objects). At most 500 lines
        per call; `next` is the offset to ask for next.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
        - {name: key, in: path, required: true, schema: {type: string, pattern: "^[tr][0-9]+$"}}
        - {name: from, in: query, required: false, schema: {type: integer, default: 0}, description: "a non-number counts as 0"}
      responses:
        "200":
          description: Lines and state.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [lines, next, state]
                properties:
                  lines: {type: array, items: {type: string}}
                  next: {type: integer}
                  state: {type: string, enum: [running, failed, finished]}
        "403": {$ref: "#/components/responses/KittRefused"}
        "404": {description: no such log, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "no such log"}}}}
  /api/approvals:
    x-code: ["/api/approvals"]
    get:
      tags: [kitt door]
      summary: "The bell: draft briefs and tasks waiting for an answer"
      x-access: kitt door
      x-machine: true
      description: Needs `read`. Draft briefs first, then waiting tasks by id.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      responses:
        "200":
          description: Items.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, at]
                      properties:
                        id: {type: string, description: "a brief id, or `question:<task id>`"}
                        kind: {type: string, enum: [brief, question]}
                        title: {type: string}
                        at: {type: string}
        "403": {$ref: "#/components/responses/KittRefused"}
  /api/approvals/{item}:
    x-code: ["/api/approvals/([^/]+)"]
    post:
      tags: [kitt door]
      summary: Approve a draft brief
      x-access: kitt door
      x-machine: true
      description: |
        Body `{"decision": "approve" | "approve_unattended"}` (build, or build without me). Runs both steps of the
        approval (`chat.approval_request` then `approval_confirm`), so their errors pass through. Errors: 400 `kitt
        approves with approve or approve_unattended; denying is not offered`; 409 `only a brief is approved; answer a
        question from Claude in the thread` (item is not a brief id); 403 `approvals from kitt are off` or the switch
        reason; and from the two steps: 409 (not a draft, already being built, approval failed), 429 (cap), 404/410
        (token; not expected here).
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
        - {name: item, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties: {decision: {type: string, enum: [approve, approve_unattended]}}
      responses:
        "200":
          description: Build started.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [task, url, brief, mode]
                properties:
                  task: {type: integer}
                  url: {type: string}
                  brief: {type: string}
                  mode: {type: string, enum: [build, without-me]}
        "400": {description: Unknown decision, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {$ref: "#/components/responses/KittRefused"}
        "409": {description: Not a brief, not a draft, already building, or approval failed, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Daily task limit, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/jobs:
    x-code: ["/api/jobs"]
    get:
      tags: [kitt door]
      summary: Job cards
      x-access: kitt door
      x-machine: true
      description: Needs `read`. All jobs sorted by name; a broken job file has `error` set and empty fields.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      responses:
        "200":
          description: Jobs.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: "#/components/schemas/JobCard"}}
        "403": {$ref: "#/components/responses/KittRefused"}
  /api/jobs/{name}/{action}:
    x-code: ["/api/jobs/([a-z0-9-]+)/(run|pause|resume)"]
    post:
      tags: [kitt door]
      summary: Run now, pause or resume a job
      x-access: kitt door
      x-machine: true
      description: |
        Needs `run_job`. Unknown or broken job: 404 `no usable job '<name>'`. `run` is `chat.run_job` (its 403 text
        is `refused: <why>`; success `{"run": id, "job": name}`). `pause` and `resume` commit to the `jobs` branch and
        write a `chris`/`kitt` message to the thread; success `{"job": name, "paused": bool}`. Creating, editing and
        deleting jobs are not offered.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
        - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]+$"}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [run, pause, resume]}}
      responses:
        "200":
          description: Done.
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - {type: object, required: [run, job], properties: {run: {type: integer}, job: {type: string}}}
                  - {type: object, required: [job, paused], properties: {job: {type: string}, paused: {type: boolean}}}
        "403": {$ref: "#/components/responses/KittRefused"}
        "404": {description: No usable job, content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}, example: {error: "no usable job 'x'"}}}}
  /api/health:
    x-code: ["/api/health"]
    get:
      tags: [kitt door]
      summary: Health checks of the box
      x-access: kitt door
      x-machine: true
      description: Needs `read`. Checks sorted by name; a status other than OK/WARN/FAIL becomes `warn`.
      parameters:
        - {$ref: "#/components/parameters/KittClient"}
        - {$ref: "#/components/parameters/TailscaleUser"}
      responses:
        "200":
          description: Checks.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [checks]
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status, text]
                      properties:
                        name: {type: string}
                        status: {type: string, enum: [ok, warn, fail]}
                        text: {type: string}
        "403": {$ref: "#/components/responses/KittRefused"}
components:
  securitySchemes:
    chatBearer:
      type: http
      scheme: bearer
      description: "Token in /etc/homelab/chat-<client>-token (directory overridable with CHAT_TOKEN_DIR); compared with hmac.compare_digest."
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string}
      description: "Page POST only: the netloc of this header must equal the `Host` header, else 403 'Verkeerde herkomst.' (a missing Origin fails too)."
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: "Mutating /api/* only: the value of `GET /api/session`; missing or wrong gives 403 `{\"error\": ...}`."
    NumericId: {name: id, in: path, required: true, schema: {type: string, pattern: "^[0-9]+$"}}
    BriefId: {name: id, in: path, required: true, schema: {type: string, pattern: "^[A-Z]-[0-9]{3,4}$"}}
    JobName: {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]+$"}}
    KittClient:
      name: X-Homelab-Client
      in: header
      required: true
      schema: {type: string, enum: [kitt]}
    TailscaleUser:
      name: Tailscale-User-Login
      in: header
      required: true
      schema: {type: string}
      description: "Set by the gate (gate.py); must equal the tailnet owner's login."
  requestBodies:
    CsrfForm:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [csrf]
            properties:
              csrf: {type: string, description: "HMAC token of pages.csrf_token(); mismatch gives 403 'Verlopen formulier; ververs de pagina.'"}
    ApiForm:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema: {type: object, description: "No csrf field: the token travels in the X-CSRF-Token header."}
    TextForm:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [csrf]
            properties:
              csrf: {type: string}
              text: {type: string, description: "CRLF normalised and trimmed"}
  responses:
    Html:
      description: HTML page.
      content:
        text/html; charset=utf-8: {schema: {type: string}}
    Redirect:
      description: See Other.
      headers:
        Location: {schema: {type: string}}
    PageForbidden:
      description: "Caller is not the tailnet owner or comes from the box itself: HTML page 'geweigerd' ('Alleen vanaf je eigen apparaten op het tailnet.')."
      content:
        text/html; charset=utf-8: {schema: {type: string}}
    PageForbiddenCsrf:
      description: |
        403 HTML page 'geweigerd': not the owner (as above), 'Verkeerde herkomst.' (Origin does not match Host) or
        'Verlopen formulier; ververs de pagina.' (CSRF token wrong).
      content:
        text/html; charset=utf-8: {schema: {type: string}}
    ApiForbidden:
      description: "Caller is not the tailnet owner or comes from the box itself: `{\"error\": \"Only from your own devices on the tailnet.\"}`."
      content:
        application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}
    ApiForbiddenCsrf:
      description: |
        403 JSON: not the owner (as above), `Wrong origin.` (Origin does not match Host) or
        `Missing or wrong X-CSRF-Token; fetch it from GET /api/session.`
      content:
        application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}
    ApiNotFound:
      description: "`{\"error\": \"Not found.\"}`."
      content:
        application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}
    PageNotFound:
      description: "HTML page 'niet gevonden' ('Niet gevonden.')."
      content:
        text/html; charset=utf-8: {schema: {type: string}}
    ForgeUnreachable:
      description: Forge does not answer or answers garbage.
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "Forge is not reachable (is homelab-app-forge running?)."}
    UpstreamUnreachable:
      description: The search service (or router) is unreachable or answered garbage.
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "The search service is unreachable: <detail>"}
    ChatBadNumbers:
      description: "`after` or `limit` is not a number."
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "after and limit are numbers"}
    ChatUnauthorized:
      description: No token, or a token no client has (the attempt is logged as a refusal of `unknown`/`authenticate`).
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "unknown client or token"}
    ChatForbidden:
      description: |
        Not loopback (`loopback only`); the client's switch is off or it lacks the permission
        (`refused: <why>`). A switch refusal also carries `discord` and `discord_approvals`.
      content:
        application/json; charset=utf-8:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              discord: {type: boolean}
              discord_approvals: {type: boolean}
          examples:
            loopback: {value: {error: "loopback only"}}
            switchedOff: {value: {error: "refused: Discord is switched off on the homelab page", discord: false, discord_approvals: false}}
            permission: {value: {error: "refused: no permission 'read'"}}
    KittRefused:
      description: |
        Identity refused (`refused: not the kitt client` / `not from kitt's service account` / `not Chris at the app`)
        or the handler refuses (`Kitt is switched off on the homelab page`, `kitt may not <permission>`,
        `approvals from kitt are off`).
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
    KittUnknown:
      description: Not one of kitt's routes (also a known path with another method).
      content:
        application/json; charset=utf-8:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "not a call kitt may make"}
  schemas:
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}}
      description: "Error body of every /api/* answer: the chat door, the kitt door and the page endpoints. A flattened upstream error may add keys (e.g. request_id)."
      additionalProperties: true
    ChatState:
      type: object
      required: [discord, discord_approvals]
      properties:
        discord: {type: boolean}
        discord_approvals: {type: boolean, description: "true only while `discord` is on and approvals are on"}
    ConversationEntry:
      type: object
      required: [id, time, author, client, kind, text, link, ref]
      properties:
        id: {type: integer}
        time: {type: string, description: "UTC ISO 8601, seconds"}
        author: {type: string, enum: [chris, claude, box, system]}
        client: {type: string, description: "discord, kitt, page, inbox, ..."}
        kind: {type: string, enum: [message, question, answer, notification, approval_request, approval]}
        text: {type: string, maxLength: 20000}
        link: {type: string, nullable: true}
        ref: {type: string, nullable: true, description: "task:<id>, job:<name>, brief:<id>, question:<id>, job:research:<run>"}
    KittEntry:
      type: object
      required: [id, at, author, client, kind, text]
      properties:
        id: {type: integer}
        at: {type: string}
        author: {type: string}
        client: {type: string, enum: [discord, kitt, page, box]}
        kind: {type: string, enum: [question, task, answer, notification, approval_request, approval]}
        text: {type: string}
    JobCard:
      type: object
      required: [name, schedule, model, deliver, paused, running, lastResult, nextRun, error]
      properties:
        name: {type: string}
        schedule: {type: string}
        model: {type: string}
        deliver: {type: string}
        paused: {type: boolean}
        running: {type: boolean}
        lastResult:
          nullable: true
          type: object
          required: [state, at, summary]
          properties:
            state: {type: string, enum: [ok, failed]}
            at: {type: string}
            summary: {type: string, maxLength: 300}
        nextRun: {type: string, nullable: true, description: "ISO 8601; null while paused or broken"}
        error: {type: string, nullable: true}
    MemoryEntry:
      type: object
      required: [id, kind, about, name, body, added, changed, source, link, status, pr, title, summary, kind_label, added_local, changed_local]
      properties:
        id: {type: string, description: "voorkeuren/<about>/<name>, feiten/<about>/<name> or geschiedenis/<yyyy-mm>/taak-<n>"}
        kind: {type: string, enum: [voorkeuren, feiten, geschiedenis]}
        about: {type: string}
        name: {type: string}
        body: {type: string}
        added: {type: string}
        changed: {type: string}
        source: {type: string}
        link: {type: string}
        status: {type: string}
        pr: {type: string}
        title: {type: string, description: "row title: first body line for history, else the name"}
        summary: {type: string, description: "first body line; empty for history"}
        kind_label: {type: string, enum: [voorkeur, feit, geschiedenis]}
        added_local: {type: string}
        changed_local: {type: string}
    Overview:
      type: object
      required: [status, live, timeline, changes, services, forge_link, switches, usage, health]
      properties:
        status:
          type: object
          required: [sentence, class, at, activity]
          properties:
            sentence: {type: string, description: "e.g. 'Alles in orde.'"}
            class: {type: string, enum: [ok, attention, bad]}
            at: {type: string, description: "ISO time of this answer, in the inbox time zone"}
            activity: {type: string, description: "same sentence as GET /api/live"}
        live:
          type: object
          required: [items, queued]
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/LiveItem"}}
            queued: {type: integer}
        timeline:
          type: object
          required: [lanes, ticks, now_x]
          properties:
            now_x: {type: number, description: "x of 'nu' in percent"}
            ticks:
              type: array
              items:
                type: object
                required: [x, label, day]
                properties: {x: {type: number}, label: {type: string}, day: {type: boolean}}
            lanes:
              type: array
              items:
                type: object
                required: [name, state, model, when, marks]
                properties:
                  name: {type: string}
                  state: {type: string, enum: [active, paused, error, deleted]}
                  model: {type: string, nullable: true, description: "local or claude; null for error and deleted"}
                  when: {type: string, nullable: true}
                  marks:
                    type: array
                    items:
                      type: object
                      required: [x, status, link, label]
                      properties:
                        x: {type: number}
                        status: {type: string, description: "ok, pr, failed, held, running or plan"}
                        link: {type: string}
                        label: {type: string}
        changes:
          type: array
          description: the last five, newest first
          items:
            type: object
            required: [ok, text, at, user, reason]
            properties:
              ok: {type: boolean}
              text: {type: string}
              at: {type: string, nullable: true}
              user: {type: string}
              reason: {type: string}
        services:
          type: array
          items:
            type: object
            required: [name, address, note]
            properties: {name: {type: string}, address: {type: string}, note: {type: string}}
        forge_link: {type: string, description: "address of the Forge line in config/services.conf, or empty"}
        switches:
          type: object
          required: [discord, discord_approvals, discord_on, kitt, kitt_may]
          properties:
            discord: {type: boolean, description: "the stored Discord switch"}
            discord_approvals: {type: boolean, description: "the stored approvals switch"}
            discord_on: {type: boolean, description: "Discord is on (the page's 'Discord is off' note shows when false)"}
            kitt: {type: boolean}
            kitt_may: {type: array, items: {type: string}, description: "kitt's permissions, sorted"}
        usage:
          type: object
          required: [days, llm, claude_jobs, inbox, cap, saved_minutes]
          properties:
            days: {type: array, items: {type: string, format: date}, description: "the last 7 days, oldest first"}
            llm: {type: array, nullable: true, items: {type: integer}, description: "null: the helper is unreachable"}
            claude_jobs: {type: array, items: {type: integer}}
            inbox: {type: array, items: {type: integer}}
            cap: {type: integer}
            saved_minutes: {type: object, additionalProperties: {type: integer}, description: "per kind of job"}
        health:
          type: object
          required: [checks, last, deploys, backup]
          properties:
            last: {type: string, nullable: true}
            checks:
              type: object
              additionalProperties:
                type: object
                required: [status, text]
                properties:
                  status: {type: string, description: "OK, WARN or FAIL"}
                  text: {type: string}
                  since: {type: string, nullable: true}
            deploys:
              type: array
              items:
                type: object
                required: [name, ok, at, sha, sync_error]
                properties:
                  name: {type: string}
                  ok: {type: boolean, nullable: true, description: "null: not deployed yet"}
                  at: {type: string, nullable: true}
                  sha: {type: string, nullable: true}
                  sync_error: {type: string, nullable: true}
            backup:
              type: object
              nullable: true
              required: [ok, at, free_bytes, free_pct]
              properties:
                ok: {type: boolean}
                at: {type: string, nullable: true}
                free_bytes: {type: integer}
                free_pct: {nullable: true}
    LiveItem:
      type: object
      required: [key, title, what, repo, model, url, cancel, started]
      properties:
        key: {type: string, description: "t<id> task, r<id> local run, f1 forge"}
        title: {type: string}
        what: {type: string}
        repo: {type: string}
        model: {type: string}
        url: {type: string, description: "/task/<id>, /run/<id>, or the forge page URL"}
        cancel: {type: string, nullable: true, description: "POST path, null for forge"}
        started: {type: string}
    LogLine:
      type: object
      required: [at, kind, text]
      properties:
        at: {type: string}
        kind: {type: string, description: "info, claude, tool, result, error, out (forge: info, claude, tool, error)"}
        text: {type: string, maxLength: 600}
    LogChunk:
      type: object
      required: [lines, next, done]
      properties:
        lines: {type: array, items: {$ref: "#/components/schemas/LogLine"}}
        next: {type: integer}
        done: {type: boolean}
    ForgeLogChunk:
      type: object
      required: [lines, next, done]
      description: "At most 500 lines; `next` is forge's own `next` when it is an integer, else `from` + number of lines; `done` is true when forge is not running."
      properties:
        lines: {type: array, items: {$ref: "#/components/schemas/LogLine"}}
        next: {type: integer}
        done: {type: boolean}
    ForgeState:
      type: object
      required: [running, step, project, activity, started, paused, pause_reason, paused_until]
      properties:
        running: {type: boolean}
        step: {nullable: true}
        project: {type: string, nullable: true}
        activity: {type: string, nullable: true}
        started: {type: string, nullable: true}
        paused: {type: boolean}
        pause_reason: {type: string, nullable: true}
        paused_until: {type: string, nullable: true}
