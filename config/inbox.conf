# homelab: instellingen voor de task inbox (F-021).
# Na een wijziging opnieuw installeren: sudo bash /var/lib/homelab/repo/scripts/21-inbox.sh

# De pagina, alleen via het tailnet (ufw: 8100-8199 alleen via tailscale0), alleen voor jouw Tailscale-login.
INBOX_PORT=8105
# Wie op GitHub review-commentaar mag geven dat een taak terugstuurt; andere accounts worden genegeerd.
OWNER_GITHUB="chrisfaber95"
# Tegelijk lopende taken (nooit twee op dezelfde repo), en de grens per ronde (een herkansing krijgt een nieuwe).
MAX_RUNNING=2
MAX_TURNS=80
MAX_MINUTES=30
# Hoe vaak de inbox GitHub vraagt naar commentaar op en de staat van zijn PR's (seconden).
GITHUB_POLL_SECONDS=60

# Mappen: de dienst (inbox-runner) en de taken (inbox).
RUNNER_HOME="/var/lib/homelab-inbox"
TASK_HOME="/var/lib/inbox"

# Jobs (F-022): de job-bestanden staan in jobs/ op deze branch van de homelab-repo (de pagina slaat ze daar op).
JOBS_BRANCH="jobs"
# Schema's van jobs gelden in deze tijdzone (de box zelf draait op UTC).
JOB_TIMEZONE="Europe/Amsterdam"
# Zoveel Claude-runs mogen jobs per dag starten; daarboven wachten ze tot morgen. Lokale jobs en je eigen taken tellen niet.
JOB_CLAUDE_CAP=10
# Een script-job (lokaal) stopt na zoveel minuten.
JOB_SCRIPT_MINUTES=10
