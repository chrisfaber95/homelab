spring.application.name=homelab-inbox-backend

# Loopback only. Host and port come from the environment; the default is 127.0.0.1.
server.address=${BACKEND_HOST:127.0.0.1}
server.port=${BACKEND_PORT:8130}

# The database (B3): PostgreSQL over its unix socket, no TCP (Q2). The unit (systemd/homelab-inbox-backend.service)
# sets SPRING_DATASOURCE_URL (pgjdbc + junixsocket, AFUNIXSocketFactory) and SPRING_DATASOURCE_USERNAME=inbox_app;
# there is no password, peer authentication lets inbox-runner in (scripts/28-inbox-db.sh).
# The app itself still has no datasource (B5 switches it on): without a URL, the JDBC and Flyway starters fail at start for lack of a URL.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.main.banner-mode=off
