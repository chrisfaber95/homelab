openapi: 3.0.3
info:
  title: homelab-inbox (current Python server)
  version: "0.1.0-contract"
  description: |
    The contract of the inbox as it is TODAY (bin/homelab_inbox/server.py and kitt.py), written down before the
    migration to a TypeScript frontend and a Spring Boot backend (docs/architecture/inbox-split.md, slice C1).
    Nothing here is a wish: status codes, field names and error bodies were copied from the handlers.

    Every operation has `x-access`:

    - `page`: the homelab page. The caller must be a device of the tailnet owner (`pages.Access`); the box itself
      (loopback or its own tailnet address) gets 403 with an HTML page. A POST also needs the CSRF checks below.
      Within `page`, `x-machine: true` marks the JSON endpoints that scripts and the page's JavaScript rely on
      (`/api/live`, `/api/log/*`, `/api/forge*`, `/api/search/*`); those are copied exactly.
    - `chat door`: `/api/chat/*`, loopback only, `Authorization: Bearer <token>` per client
      (`/etc/homelab/chat-<name>-token`), permissions from `config/clients.json`. Used by the Discord bot.
    - `kitt door`: loopback only, selected by the header `X-Homelab-Client` (any value), then identified as kitt
      (`kitt.identify`). Used by kitt's adapter. Handled before the chat door and before the page check.

    Dispatch order for GET and POST: kitt door, chat door, page check. Other methods (PUT, DELETE, HEAD, OPTIONS,
    PATCH) are not implemented: the Python server answers 501 (`BaseHTTPRequestHandler`).

    Every error under `/api/*` has the JSON body `{"error": "<text>"}` (schema `Error`), including a refused caller,
    an unknown route and an unexpected failure (500). Every mutating `/api/*` request (POST, PUT, PATCH, DELETE) needs
    the `Origin` of this page and the header `X-CSRF-Token` with the value of `GET /api/session`; a missing or wrong
    one is 403 `{"error": ...}`. PUT, PATCH and DELETE are not implemented: after the checks they answer 405 JSON.
    The chat and kitt doors have their own checks and are not affected.

    Quirks that a replacement must keep (or deliberately change in a later slice):

    - Several page GET routes match `self.path` (path plus query string), so `GET /task/5?x=1` is a 404 where
      `GET /memory?q=x` works. Routes that use `url.path` ignore the query. Each operation says which.
    - Page POST bodies are `application/x-www-form-urlencoded`, read up to 64 KiB, first value of a repeated key.
    - Every response from `Handler.send` carries `Cache-Control: no-store` (static files: `private, max-age=86400`),
      the Content-Security-Policy `default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src
      'self'; connect-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'`,
      `X-Frame-Options: DENY` and `Referrer-Policy: same-origin`. JSON from `send_upstream` is
      `application/json; charset=utf-8`; `/api/live` and `/api/log/<t|r>N` are plain `application/json`.
    - Text of errors and pages is partly Dutch (existing text stays as it is).
    - `x-code` lines list the literal route strings of the Python source for each path; the test
      `tests/test_inbox_openapi.py` fails when a route of server.py or kitt.py is missing here.
  license:
    name: private
servers:
  - url: http://homelab.tail4eb878.ts.net:8105
    description: page access (tailnet owner only)
  - url: http://127.0.0.1:8105
    description: chat door and kitt door (loopback only)
x-code: ["/jobs/", "/job/", "/draft/", "/agents/", "/memory/"]
x-code-note: "Prefixes dispatched by do_POST via self.path.startswith(...) to post_jobs, post_agent and post_memory; the concrete routes are below."
tags:
  - {name: page, description: "HTML pages and forms of the homelab page"}
  - {name: machine, description: "JSON endpoints that must keep path and body exactly"}
  - {name: chat door, description: "Discord bot, loopback, bearer token"}
  - {name: kitt door, description: "kitt adapter, loopback, header and peer uid"}
paths:
  # ------------------------------------------------------------------------------------------------ static
  /static/{file}:
    x-code: ["/static/((?:fonts/)?[A-Za-z0-9-]+\\.(css|js|woff2))"]
    get:
      tags: [page]
      summary: A file from web/ (css, js, woff2)
      x-access: page
      description: |
        Matches `/static/((?:fonts/)?[A-Za-z0-9-]+\.(css|js|woff2))` on `url.path`; the file is `web/<group 1>`.
        If the file does not exist the handler does NOT answer here: it falls through the remaining routes and ends in
        the generic 404 page.
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}, description: "e.g. app.css, app.js, fonts/x.woff2"}
      responses:
        "200":
          description: "The file. `Cache-Control: private, max-age=86400`."
          content:
            text/css; charset=utf-8: {schema: {type: string}}
            text/javascript; charset=utf-8: {schema: {type: string}}
            font/woff2: {schema: {type: string, format: binary}}
        "403": {$ref: "#/components/responses/PageForbidden"}
        "404": {$ref: "#/components/responses/PageNotFound"}
  # ------------------------------------------------------------------------------------------------ machine (page access)
  /api/session:
    x-code: ["/api/session"]
    get:
      tags: [machine]
      summary: The CSRF token for mutating /api/* requests
      x-access: page
      x-machine: true
      description: |
        Returns the token that every mutating (POST, PUT, PATCH, DELETE) `/api/*` request of the page must send as
        the `X-CSRF-Token` header (next to the `Origin` check). The token is stable while the inbox's secret file
        (`csrf-secret`) is; the page's JavaScript fetches it once. Only the tailnet owner's devices can read it (the
        page check), so a cross-site page cannot.
      responses:
        "200":
          description: The token.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [csrf_token]
                properties: {csrf_token: {type: string}}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/memory:
    x-code: ["/api/memory"]
    get:
      tags: [machine]
      summary: Memory (Geheugen) list as JSON, what the /memory page renders
      x-access: page
      x-machine: true
      description: |
        The same data as `GET /memory`: preferences, facts and history filtered by `q` (every word must occur in id,
        about, source, status or body; `q` is cut to 200 characters). The three sections always come in the order
        `voorkeuren`, `feiten`, `geschiedenis`. History is sorted newest first and cut to the newest 30 unless `q` is
        given (`truncated` is then true). `abouts` are the choices of the add form. Dates are the stored strings; the
        `*_local` fields are what the page shows (dd-mm hh:mm).
      parameters: [{name: q, in: query, required: false, schema: {type: string}}]
      responses:
        "200":
          description: The sections and the add-form choices.
  /api/skills:
    x-code: ["/api/skills"]
    get:
      tags: [machine]
      summary: What the Skills tab shows, as JSON
      x-access: page
      x-machine: true
      description: |
        The data `skills_page` renders, for the TypeScript page: the merged skills with the jobs that use each, the
        20 newest skill proposals (newest first) and the page's Dutch texts. `created` is already formatted as
        `dd-mm HH:MM` in the box's time zone (`-` when empty). The HTML page `/skills` is unchanged.
      responses:
        "200":
          description: The Skills page data.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [q, sections, abouts]
                properties:
                  q: {type: string}
                  sections:
                    type: array
                    items:
                      type: object
                      required: [kind, count, truncated, entries]
                      properties:
                        kind: {type: string, enum: [voorkeuren, feiten, geschiedenis]}
                        count: {type: integer, description: "matches, also those not shown"}
                        truncated: {type: boolean}
                        entries:
                          type: array
                          items: {$ref: "#/components/schemas/MemoryEntry"}
                  abouts: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/memory/e/{id}:
    x-code: ["/api/memory/e/(.+)"]
    get:
      tags: [machine]
      summary: One memory entry as JSON, what the /memory/e/{id} page renders
      x-access: page
      x-machine: true
      description: |
        The id contains slashes (`voorkeuren/<about>/<name>`, ...); in the template it stands for the whole remainder
        after `/api/memory/e/`. Matched on `url.path`.
      parameters: [{name: id, in: path, required: true, schema: {type: string}, allowReserved: true}]
      responses:
        "200":
          description: The entry plus the branch and repo it is stored in.
          content:
            application/json; charset=utf-8:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MemoryEntry"
                  - type: object
                    required: [branch, data_repo]
                    properties:
                      branch: {type: string, description: "MEMORY_BRANCH"}
                      data_repo: {type: string, description: "DATA_REPO"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {description: "`{\"error\": \"No such memory entry.\"}`", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
                required: [intro, empty, proposals_empty, skills, proposals]
                properties:
                  intro: {type: string}
                  empty: {type: string, description: "shown when `skills` is empty"}
                  proposals_empty: {type: string, description: "shown when `proposals` is empty"}
                  skills:
                    type: array
                    items:
                      type: object
                      required: [name, description, jobs]
                      properties:
                        name: {type: string}
                        description: {type: string}
                        jobs: {type: array, items: {type: string}, description: "names of the jobs that use it; empty shows 'geen'"}
                  proposals:
                    type: array
                    items:
                      type: object
                      required: [name, pr_url, task_id, created]
                      properties:
                        name: {type: string}
                        pr_url: {type: string}
                        task_id: {type: integer, nullable: true}
                        created: {type: string}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/overview:
    x-code: ["/api/overview"]
    get:
      tags: [machine]
      summary: Everything the Overview page ("/") shows, as data
      x-access: page
      x-machine: true
      description: |
        The data behind `pages.overview_page()` (H-022 F6a): status sentence, live items, the job timeline, the last
        five changes, services, the Discord and kitt switches, a week of usage and the health block. Texts are the
        same Dutch sentences the HTML page shows; times are ISO strings. Not cached.
      responses:
        "200":
          description: The Overview data.
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Overview"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/skills:
    x-code: ["/api/skills"]
    get:
      tags: [machine]
      summary: What the Skills tab shows, as JSON
      x-access: page
      x-machine: true
      description: |
        The data `skills_page` renders, for the TypeScript page: the merged skills with the jobs that use each, the
        20 newest skill proposals (newest first) and the page's Dutch texts. `created` is already formatted as
        `dd-mm HH:MM` in the box's time zone (`-` when empty). The HTML page `/skills` is unchanged.
      responses:
        "200":
          description: The Skills page data.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [intro, empty, proposals_empty, skills, proposals]
                properties:
                  intro: {type: string}
                  empty: {type: string, description: "shown when `skills` is empty"}
                  proposals_empty: {type: string, description: "shown when `proposals` is empty"}
                  skills:
                    type: array
                    items:
                      type: object
                      required: [name, description, jobs]
                      properties:
                        name: {type: string}
                        description: {type: string}
                        jobs: {type: array, items: {type: string}, description: "names of the jobs that use it; empty shows 'geen'"}
                  proposals:
                    type: array
                    items:
                      type: object
                      required: [name, pr_url, task_id, created]
                      properties:
                        name: {type: string}
                        pr_url: {type: string}
                        task_id: {type: integer, nullable: true}
                        created: {type: string}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/live:
    x-code: ["/api/live"]
    get:
      tags: [machine]
      summary: What runs now ("Nu bezig") and the activity sentence
      x-access: page
      x-machine: true
      description: Polled by the page every few seconds. Content type is plain `application/json` (no charset).
      responses:
        "200":
          description: Running items, number of queued tasks (of the 100 newest), and one Dutch sentence.
          content:
            application/json:
              schema:
                type: object
                required: [items, queued, activity]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/LiveItem"}
                  queued: {type: integer, description: "queued tasks among the 100 newest"}
                  activity: {type: string, description: "e.g. 'Niets bezig. Volgende job: x, ...'"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/log/{key}:
    x-code: ["/api/log/{forge.LIVE_KEY}", "/api/log/([tr])(\\d+)"]
    get:
      tags: [machine]
      summary: Live log of a task (t<id>), a job run (r<id>) or forge (f1), from a line offset
      x-access: page
      x-machine: true
      description: |
        Three routes share this path shape, matched in this order on `url.path`:

        1. `/api/log/f1` (`forge.LIVE_KEY`): forge's own log through `forge.log(from)`; JSON is
           `application/json; charset=utf-8`; upstream failure is 502 `{"error": "..."}`.
        2. `/api/log/t<digits>` (task) and `/api/log/r<digits>` (job run): lines of `logs/<key>.log` from line
           `from`, at most 500 per call. Content type `application/json`. An unknown id is not an error: `lines` is
           empty and `done` is true. `done` is true when the task is not `queued`/`running` (or the run not
           `queued`/`running`), or does not exist, and no lines are left after this chunk.

        Any other key (for example `t` without digits) is not a route: 404 `{"error": "Not found."}`.
        A non-numeric `from` is 400 `{"error": "from must be a number"}`. A negative `from` is clamped to 0.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, pattern: "^(f1|[tr][0-9]+)$"}}
        - {name: from, in: query, required: false, schema: {type: integer, default: 0}, description: "first line index (forge: sequence)"}
      responses:
        "200":
          description: A chunk of log lines.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/LogChunk"}
                  - {$ref: "#/components/schemas/ForgeLogChunk"}
        "400": {description: "`from` is not a number.", content: {application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/Error"}}}}
        "502": {$ref: "#/components/responses/ForgeUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
  /api/forge:
    x-code: ["/api/forge"]
    get:
      tags: [machine]
      summary: Forge's state (proxied from FORGE_URL/api/state)
      x-access: page
      x-machine: true
      responses:
        "200":
          description: Forge's state as the page needs it.
          content:
            application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/ForgeState"}}
        "502": {$ref: "#/components/responses/ForgeUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/forge/{action}:
    x-code: ["/api/forge/(start|stop)"]
    post:
      tags: [machine]
      summary: Start or stop forge (the page's Start and Stop buttons)
      x-access: page
      x-machine: true
      description: |
        Needs the page POST checks (Origin and the `X-CSRF-Token` header, see components). The body fields are otherwise ignored.
        The inbox calls `POST FORGE_URL/api/<action>` with `{}`, prints `forge <action> by <device>` to the journal,
        drops its 2-second cache and answers with the new state (same as `GET /api/forge`). The route regex only
        matches `start` and `stop`, so the 400 `Unknown action.` of `forge.control` is unreachable through HTTP.
      parameters:
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop]}}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody: {$ref: "#/components/requestBodies/ApiForm"}
      responses:
        "200":
          description: Forge's state after the action.
          content:
            application/json; charset=utf-8: {schema: {$ref: "#/components/schemas/ForgeState"}}
        "502":
          description: Forge unreachable, or it refused (HTTP >= 400 from forge).
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                unreachable: {value: {error: "Forge is not reachable (is homelab-app-forge running?)."}}
                refused: {value: {error: "Forge refused start (HTTP 409): no reason given"}}
        "403": {$ref: "#/components/responses/ApiForbiddenCsrf"}
  /api/search/filters:
    x-code: ["/api/search/filters"]
    get:
      tags: [machine]
      summary: Search filters (proxied from SEARCH_URL/v1/filters)
      x-access: page
      x-machine: true
      description: |
        Status and body of the search API are passed through (`search.call`). A dead or garbled upstream becomes 502
        `{"error": "The search service is unreachable: <detail>"}`; an upstream HTTP error with a non-JSON
        body becomes `{"error": "Upstream answered HTTP <code>."}` with that code. The search API's own
        200 body is `{"projects": [...], "types": [...], ...}`; its errors `{"error": {"message", "request_id"?}}` are flattened to `{"error": "<message>", "request_id"?}`.
      responses:
        "200": {description: "Upstream body", content: {application/json; charset=utf-8: {schema: {type: object, additionalProperties: true}}}}
        "502": {$ref: "#/components/responses/UpstreamUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/search/results:
    x-code: ["/api/search/results"]
    get:
      tags: [machine]
      summary: Search results (proxied from SEARCH_URL/v1/search)
      x-access: page
      x-machine: true
      description: |
        The inbox sends `q` plus those of `project`, `type`, `source` that are non-empty. `q` defaults to the empty
        string. Other query parameters are dropped. Status and body of the search API are passed through
        (`{"query": q, "results": [...]}` on 200).
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, default: ""}}
        - {name: project, in: query, required: false, schema: {type: string}}
        - {name: type, in: query, required: false, schema: {type: string}}
        - {name: source, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: "Upstream body", content: {application/json; charset=utf-8: {schema: {type: object, additionalProperties: true}}}}
        "502": {$ref: "#/components/responses/UpstreamUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
  /api/search/ask:
    x-code: ["/api/search/ask"]
    post:
      tags: [machine]
      summary: Ask a question of the private search (proxied to SEARCH_URL/v1/ask)
      x-access: page
      x-machine: true
      description: |
        Form fields (after the Origin and token checks): `question` (required, trimmed, cut to 2000 characters), optional filters
        `project`, `type`, `source`, and `hard` (`1`, `true` or `on` sets `hard: true`). Waits up to 330 s for the
        upstream. Status and body of the search API are passed through; its 200 body is
        `{"found": bool, "answer": ..., "citations": [{"n", "path", "location", "link"?}], "request_id"?, ...}`.
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string}
                project: {type: string}
                type: {type: string}
                source: {type: string}
                hard: {type: string, enum: ["1", "true", "on"]}
      responses:
        "200": {description: "Upstream body", content: {application/json; charset=utf-8: {schema: {type: object, additionalProperties: true}}}}
        "400":
          description: Empty question.
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Error"}
              example: {error: "Type a question first."}
        "502": {$ref: "#/components/responses/UpstreamUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbiddenCsrf"}
  /api/search/feedback:
    x-code: ["/api/search/feedback"]
    post:
      tags: [machine]
      summary: Thumbs-down for the router request behind an answer (proxied to ROUTER_URL/v1/feedback)
      x-access: page
      x-machine: true
      description: |
        `request_id` must match `[A-Za-z0-9_-]{6,64}`. The inbox sends `{"request_id": ..., "note": <first 1000
        characters or null>}`. Status and body of the router are passed through (200 body of the router).
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: {type: string, pattern: "^[A-Za-z0-9_-]{6,64}$"}
                note: {type: string}
      responses:
        "200": {description: "Router body", content: {application/json; charset=utf-8: {schema: {type: object, additionalProperties: true}}}}
        "400":
          description: Missing or malformed request id.
          content:
            application/json; charset=utf-8:
              schema: {$ref: "#/components/schemas/Error"}
              example: {error: "That answer has no request id to mark."}
        "502": {$ref: "#/components/responses/UpstreamUnreachable"}
        "403": {$ref: "#/components/responses/ApiForbiddenCsrf"}
  # ------------------------------------------------------------------------------------------------ pages (GET)
  /:
    x-code: ["/"]
    get:
      tags: [page]
      summary: Overview (Overzicht), the homelab page
      x-access: page
      description: Matched on `self.path` (a query string gives 404).
      responses: {"200": {$ref: "#/components/responses/Html"}, "403": {$ref: "#/components/responses/PageForbidden"}, "404": {$ref: "#/components/responses/PageNotFound"}}
  /taken:
    x-code: ["/taken"]
    get:
      tags: [page]
      summary: Tasks list and the new-task form
      x-access: page
      description: Matched on `url.path`.
      responses: {"200": {$ref: "#/components/responses/Html"}, "403": {$ref: "#/components/responses/PageForbidden"}}
  /search:
    x-code: ["/search"]
    get:
      tags: [page]
      summary: Search tab
      x-access: page
      description: Matched on `url.path`.
      responses: {"200": {$ref: "#/components/responses/Html"}, "403": {$ref: "#/components/responses/PageForbidden"}}
  /ssh:
    x-code: ["/ssh"]
    get:
      tags: [page]
      summary: SSH tab (form to add a public key)
      x-access: page
      description: Matched on `url.path`.
      responses: {"200": {$ref: "#/components/responses/Html"}, "403": {$ref: "#/components/responses/PageForbidden"}}
    post:
      tags: [page]
      summary: Ask homelab-admin to add an SSH key
      x-access: page
      description: |
        Calls the homelab-admin socket with `{"cmd": "sshkey", "label": name, "key": key, "by": <device>}`. On success
        the same page is returned with 200 and the result; on a refusal 400 with the message. A pasted private key is
        never echoed back (the key field is blanked).
      parameters: [{$ref: "#/components/parameters/Origin"}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf: {type: string}
                name: {type: string}
                key: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Html"}
        "400": {description: "HTML page with the error (`text` of the admin answer, or 'mislukt')", content: {text/html; charset=utf-8: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/PageForbiddenCsrf"}
  /memory:
    x-code: ["/memory"]
    get:
      tags: [page]
      summary: Memory (Geheugen) list
      x-access: page
      description: Matched on `url.path`; `q` is cut to 200 characters.
