spring.application.name=homelab-inbox-backend

# Loopback only. Host and port come from the environment; the default is 127.0.0.1.
server.address=${BACKEND_HOST:127.0.0.1}
server.port=${BACKEND_PORT:8130}

# The database (B3): PostgreSQL over its unix socket, no TCP (Q2). The unit (systemd/homelab-inbox-backend.service)
# sets SPRING_DATASOURCE_URL (pgjdbc + junixsocket, AFUNIXSocketFactory) and SPRING_DATASOURCE_USERNAME=inbox_app;
# there is no password, peer authentication lets inbox-runner in (scripts/28-inbox-db.sh).
# The app itself still has no datasource (B5 switches it on): without a URL, the JDBC and Flyway starters fail at start for lack of a URL.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.main.banner-mode=off

# The shared secret of the Python facade (B6): requests to every route but GET /api/backend/health need it in the
# X-Inbox-Facade header. From BACKEND_SECRET or the file BACKEND_SECRET_FILE (set by the unit, made by
# scripts/27-backend.sh); with neither, every non-health request is refused.
backend.secret=${BACKEND_SECRET:}
backend.secret-file=${BACKEND_SECRET_FILE:}

# The read routes moved from Python (H-024 M1): the installed config directory (the *.conf files and clients.json the
# Python inbox reads). Everything else they read comes from the same paths as the Python inbox: INBOX_RUNNER_HOME,
# REPOS_CONF, DEPLOY_STATE, LLM_URL and the keys of the *.conf files (read-only; docs/inbox-backend.md).
inbox.config-dir=${INBOX_CONFIG_DIR:/usr/local/lib/homelab/config}

# The inbox core in shadow (H-026 K1): the scheduler and restart recovery are off. On refuses to start until real
# effects exist (docs/inbox-backend.md, "Core in shadow"). Env: CORE_SCHEDULER_ENABLED.
core.scheduler.enabled=${CORE_SCHEDULER_ENABLED:false}
# Which Effects the core uses (H-028 W1): shadow (default; nothing leaves the process) or live (starts runners, merges PRs
# with gh, sends ntfy). The scheduler loop starts only with core.effects=live AND core.scheduler.enabled=true.
core.effects=${CORE_EFFECTS:shadow}

# The front door (H-026 K8): owner check, CSRF and headers in Java. Off by default; the staging and cut-over units set it (H-028).
inbox.front-door.enabled=${INBOX_FRONT_DOOR_ENABLED:false}
