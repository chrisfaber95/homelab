# homelab: skills en hun gereedschap voor het account claude (gelezen door scripts/18-claude.sh).
# Na een wijziging opnieuw installeren, als claude: bash /var/lib/homelab/repo/scripts/18-claude.sh

# Skills uit Anthropics repo, vastgepind op een commit (git controleert de inhoud). Een nieuwe commit: eerst de
# bestanden lezen, dan hier bijwerken via een PR. Ze komen in ~/.claude/skills/<naam>; andere skills daar blijven staan.
SKILLS_REPO="https://github.com/anthropics/skills.git"
SKILLS_COMMIT="dbd4588f9e1033efb41dad4bef2f7947c8993d44"
SKILLS="frontend-design web-artifacts-builder webapp-testing"

# web-artifacts-builder: pnpm, globaal in ~/.local (npm-prefix), want /usr is van root.
PNPM_VERSION="12.12.1"
# webapp-testing: Playwright in een eigen venv, met alleen de headless Chromium (~115 MB in ~/.cache/ms-playwright).
# De systeembibliotheken daarvoor staan in config/machine.conf.
PLAYWRIGHT_VERSION="1.63.0"
PLAYWRIGHT_VENV="$HOME/.local/share/playwright-venv"

# gitleaks: secrets zoeken in een repo en zijn hele history (`gitleaks git <repo> --log-opts=--all`), vastgepind.
# Hash: de regel voor gitleaks_<versie>_linux_x64.tar.gz in gitleaks_<versie>_checksums.txt van de GitHub-release.
GITLEAKS_VERSION="8.30.1"
GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
# graphify: code knowledge graph for the Obsidian code map (/srv/obsidian/code-map, built by the second-brain vault's
# bin/code-map.sh). Own venv; code-only extraction runs locally without an LLM. Extras: pdf, sql (the .sql schemas).
# The PyPI name is graphifyy (two y's); the command is graphify.
GRAPHIFY_VERSION="0.9.97"
GRAPHIFY_VENV="$HOME/.local/share/graphify-venv"

# Plugins uit Anthropics marketplace, vastgepind op een commit: scripts/18-claude.sh haalt alleen deze mappen op en
# zet ze in een eigen lokale marketplace ($PLUGINS_DIR, naam homelab-pinned), zodat een update van de officiële
# marketplace ze niet stilletjes verandert. Een nieuwe commit: eerst de bestanden lezen, dan hier bijwerken via een PR.
# - pr-review-toolkit: review-agents (silent-failure-hunter, code-reviewer, pr-test-analyzer, ...) en /review-pr.
# - claude-md-management: CLAUDE.md bijhouden (/revise-claude-md en de skill claude-md-improver).
# Alleen Markdown (agents, commands, skills), zonder hooks of scripts: ze doen niets buiten de eigen sessie.
# Geen security-guidance en claude-security: die roepen zelf de Claude-API aan (keuze van de gebruiker, 2026-10-29).
PLUGINS_REPO="https://github.com/anthropics/claude-plugins-official.git"
PLUGINS_COMMIT="f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
PLUGINS="pr-review-toolkit claude-md-management"
PLUGINS_DIR="$HOME/.local/share/claude-plugins-pinned"

# Eigen agents voor de homelab staan in claude/agents/ van deze repo; 18-claude.sh kopieert ze naar ~/.claude/agents
# (andere agents daar blijven staan).
