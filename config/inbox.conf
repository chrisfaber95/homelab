# homelab: instellingen voor de task inbox (F-021).
# Na een wijziging opnieuw installeren: sudo bash /var/lib/homelab/repo/scripts/21-inbox.sh

# De pagina, alleen via het tailnet (ufw: 8100-8199 alleen via tailscale0), alleen voor jouw Tailscale-login.
INBOX_PORT=8105
# Wie op GitHub review-commentaar mag geven dat een taak terugstuurt; andere accounts worden genegeerd.
OWNER_GITHUB="chrisfaber95"
# Tasks running at once, in total and on one repo (each task has its own working copy and branch), and the limit per
# round (a retry gets a new one).
MAX_RUNNING=4
MAX_PER_REPO=3
MAX_TURNS=80
MAX_MINUTES=30
# Een bericht met repo "auto" wordt over hooguit zoveel kindtaken verdeeld; meer vraagt eerst om een keuze.
ROUTE_MAX_CHILDREN=3
# A PR that conflicts with main goes back to its task with the conflicted files at most this often; then you're notified.
CONFLICT_ROUNDS=2
# Hoe vaak de inbox GitHub vraagt naar commentaar op en de staat van zijn PR's (seconden).
GITHUB_POLL_SECONDS=60

# Mappen: de dienst (inbox-runner) en de taken (inbox).
RUNNER_HOME="/var/lib/homelab-inbox"
TASK_HOME="/var/lib/inbox"

# Jobs en geheugen staan in een eigen, privé repo, niet in de homelab-repo: die mag public (portfolio), maar jobs en
# geheugen bevatten persoonlijke voorkeuren, feiten en taakgeschiedenis. 21-inbox.sh weigert als deze repo public is.
DATA_REPO="chrisfaber95/homelab-data"

# Jobs (F-022): de job-bestanden staan in jobs/ op deze branch van DATA_REPO (de pagina slaat ze daar op).
JOBS_BRANCH="jobs"
# Schema's van jobs gelden in deze tijdzone (de box zelf draait op UTC).
JOB_TIMEZONE="Europe/Amsterdam"
# Zoveel Claude-runs mogen jobs per dag starten; daarboven wachten ze tot morgen. Lokale jobs en je eigen taken tellen niet.
JOB_CLAUDE_CAP=10
# Een script-job (lokaal) stopt na zoveel minuten.
JOB_SCRIPT_MINUTES=10

# Geheugen (F-023): voorkeuren, feiten en geschiedenis op deze branch van DATA_REPO (alleen de inbox schrijft erop).
MEMORY_BRANCH="memory"
# Zoveel recente taken voor dezelfde repo staan in de systeemprompt; de rest van de geschiedenis doorzoekt Claude zelf.
MEMORY_RECENT=10

# Briefs (H-001): approved briefs on main of this private repo get a Build action on the page (tab Briefs).
PRODUCT_REPO="chrisfaber95/product"
# The planner splits one brief into at most this many tasks.
PLAN_MAX_TASKS=6
# Automatic rework rounds when the brief reviewer finds a missed criterion, before you are notified.
REVIEW_REWORK_ROUNDS=1
# The reviewer reads at most this much of a PR's diff (characters), without lockfiles, generated files and fixture
# data; code and tests come before docs.
REVIEW_MAX_DIFF=150000
