# homelab: skills en hun gereedschap voor het account claude (gelezen door scripts/18-claude.sh).
# Na een wijziging opnieuw installeren, als claude: bash /var/lib/homelab/repo/scripts/18-claude.sh

# Skills, per bron vastgepind op een commit (git controleert de inhoud). Een nieuwe skill of commit: eerst alle
# bestanden lezen, dan hier bijwerken via een PR. Per regel: <repo> <commit> <pad naar skill-map>...
# Elke skill komt in ~/.claude/skills/<laatste deel van het pad>; andere skills daar blijven staan.
SKILL_SOURCES=(
  # Anthropic (Apache-2.0)
  "https://github.com/anthropics/skills.git dbd4588f9e1033efb41dad4bef2f7947c8993d44
   skills/frontend-design skills/web-artifacts-builder skills/webapp-testing"
  # claude-code-templates (MIT): alleen ui-ux-pro-max (stdlib-Python en CSV's, geen netwerk)
  "https://github.com/davila7/claude-code-templates.git 79182c51fbaa0e5ed14577ffe55b547a6541337a
   cli-tool/components/skills/creative-design/ui-ux-pro-max"
)

# web-artifacts-builder: pnpm, globaal in ~/.local (npm-prefix), want /usr is van root.
PNPM_VERSION="12.12.1"
# webapp-testing: Playwright in een eigen venv, met alleen de headless Chromium (~115 MB in ~/.cache/ms-playwright).
# De systeembibliotheken daarvoor staan in config/machine.conf.
PLAYWRIGHT_VERSION="1.63.0"
PLAYWRIGHT_VENV="$HOME/.local/share/playwright-venv"
