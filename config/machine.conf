# homelab: pakketten en tailnet-poorten die via `homelab-admin` (direct pad) zijn toegevoegd (F-019).
# homelab-admin legt alles wat hier staat aan (ook na een herbouw); een regel weghalen verwijdert niets.
# `homelab-admin status` meldt een directe wijziging die hier nog niet staat.
#   package <naam>           een pakket uit Ubuntu's eigen repo's
#   port <poort>/<tcp|udp>   een poort, alleen open via tailscale0

# Skills van claude (config/claude.conf): een venv voor Playwright, en wat de headless Chromium nodig heeft.
package python3.12-venv
package libasound2t64
package libatk1.0-0t64
package libatk-bridge2.0-0t64
package libatspi2.0-0t64
package libgbm1
package libxcomposite1
package libxdamage1
package libxfixes3
package libxrandr2
package fonts-liberation
# Plugins van claude (scripts/18-claude.sh): de marketplace bewerken.
package jq
