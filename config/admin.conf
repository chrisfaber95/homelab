# homelab: instellingen voor homelab-admin (F-019). De GitHub-repo en het token komen uit config/deploy.conf.
# Na een wijziging opnieuw installeren: sudo bash /var/lib/homelab/repo/scripts/19-admin.sh

# ntfy (pushmeldingen naar je telefoon, alleen via het tailnet), vastgepind.
# Hash: de regel voor ntfy_<versie>_linux_amd64.tar.gz in checksums.txt van de GitHub-release.
NTFY_VERSION="2.34.0"
NTFY_SHA256="f78e2645c6457363f37d5d1c4f7cddb7e9658abd197824a7387a1a38d92bb895"
# De volledige Tailscale-naam van de box: werkt op elk netwerk zolang Tailscale aan staat, zonder zoekdomein.
# Op een iPhone moet de server-URL in de ntfy-app hier precies op lijken (http://<naam>:NTFY_PORT).
TAILNET_NAME="homelab.tail4eb878.ts.net"
NTFY_PORT=8102
NTFY_TOPIC="homelab"

# Bevestig-knop in de melding na een firewall- of netwerkwijziging, en hoe lang je de tijd hebt (seconden).
CONFIRM_PORT=8103
CONFIRM_SECONDS=300
# SSH-sleutels via de homelab-pagina komen bij dit account (met de knop Bevestig, binnen CONFIRM_SECONDS).
SSH_KEY_USER="chris"

# Hoe vaak de box main van de homelab-repo ophaalt voor nieuwe wijzigingen en open PR's (seconden).
POLL_SECONDS=30
# Het dagoverzicht, om dit uur (lokale tijd).
SUMMARY_HOUR=19

# De eigen clone van root (alleen root kan hem wijzigen), staat en logboek.
REPO_DIR="/var/lib/homelab/repo"
STATE_DIR="/var/lib/homelab/admin"
LOG_FILE="/var/log/homelab/changes.jsonl"
SOCKET="/run/homelab-admin.sock"
